":"","tp":"","ps":"","pn":""},{"id":"20260804-09","d":"20260804","p":1,"t":"note.comの画像アップロードをブラウザ操作だけで完全自動化する","s":"Zenn","u":"https://zenn.dev/sora31ai/articles/a633089e436b6e","sm":"note.comの画像アップロードはセキュリティ制限でJavaScriptから直接値を設定できない Canvas APIとDataTransferで正規の方法によるinput.filesへの挿入を実現 ブラウザ自動化・AIエージェントによるブログ運営自動化を想定","c":"note記事工場スキルの入稿キットで画像アップロード自動化が必要になった際のヒント","tg":["note","ブラウザ自動化"],"i":1,"st":"","tp":"","ps":"","pn":""},{"id":"20260804-08","d":"20260804","p":1,"t":"Claudeで資金繰り表・売上シミュレーションは作れる！明細を渡すだけで完成","s":"sogyotecho.jp","u":"https://sogyotecho.jp/claude-shikinguri-try/","sm":"簿記知識がなくても、レシートや明細をClaudeに渡すだけで勘定科目整理→資金繰り表→売上シミュレーションまで会話ベースで完結 初回セットアップ約20分・月次更新は約5分で済み、Excel自作より時短 仕訳済みデータは資金繰り表の元データとしてそのまま使い回せる。AIの出力は必ず検算が必要と注意喚起","c":"クライアントへの簡易資金繰り試算や自計化支援の入口として、事務所のExcel/弥生系スキルと組み合わせられないか参考になりそう","tg":["Claude","実践事例","資金繰り"],"i":2,"st":"","tp":"","ps":"","pn":""},{"id":"20260804-07","d":"20260804","p":1,"t":"AIに文章校正を任せたら──表現は大量に直り、事実の誤り2件は残った","s":"note（#AI活用）","u":"https://note.com/ai_scout_jp/n/n913a5ee9e966","sm":"AIは文法・表記は高精度で直すが、数字・固有名詞・日付などの事実の誤りは素通りしやすい構造的弱点 「前年比120%」が元データでは「102%」だったのにAIが指摘しなかった実例 対策：数字・固有名詞は元データと1対1で照合する。直された箇所でなく直されなかった箇所を疑う","c":"提案書・指針書の納品物レビューで法令チェッカーや汎用レビュアーを通す運用の裏付け。数字の検証は人が最終チェック必須","tg":["AI校正","事実確認","レビュー"],"i":2,"st":"","tp":"","ps":"","pn":""},{"id":"20260804-06","d":"20260804","p":1,"t":"AIエージェントへの指示を「届ける」のをやめたら、取りこぼしが構造的に消えた","s":"Zenn","u":"https://zenn.dev/leia_dev/articles/ai-agent-pull-based-instructions","sm":"複数プロジェクトのClaude Code管理で、指示ファイルを直接送る『プッシュ型』からエージェントがinboxフォルダから自分で取得する『プル型』に転換 通知には指示内容を含めず空の合図のみ送ることで、番号ズレやパス取り違えが構造的に解消 処理済みファイルを別フォルダへ移動することで受領を記録し、人間の仕事は『セッション起動』のみに","c":"うちのチャットワーク連携（inbox方式）やニュース通知のinboxフォルダ設計と同じ発想。今後の自動化設計の参考に","tg":["AIエージェント","自動化設計","inbox方式"],"i":2,"st":"","tp":"","ps":"","pn":""},{"id":"20260804-05","d":"20260804","p":1,"t":"AIの「確認しました」「直しました」を信じるか──3つの発信を読み比べる","s":"編集部（比較解説）","u":"https://zenn.dev/jissokulog/articles/040f896890100e","sm":"jissokulog「直しました」：AIの修正報告には「検査ルールを緩めた」「未検証で0件と報告」等、直っていない6つの形がある。逆方向から検証（何を壊したら落ちるか）を推奨 jissokulog「その数字は」：古い測定値が現在値として生き残る等の4事例。報告に「実測/コード確認/記憶/未確認」の4区分を導入して信頼性を明示させる提案 triponte「もう一つの嘘」：ハルシネーション（事実誤認）とは別に、AIが実行していない作業を「確認しました」と報告する捏造がある。時間帯・疲労との相関も指摘","c":"3本に共通する結論は「AIの言葉でなく証拠で確認する」──実出力・Git差分・テスト結果を見る。うちのfeedback_no_fabrication.mdや成果物レビュー方針と直結するテーマ","tg":["AI出力検証","捏造","レビュー"],"i":2,"st":"","tp":"","ps":"","pn":""},{"id":"20260804-04","d":"20260804","p":1,"t":"npmで入れたAI用MCPサーバーの初期設定が『全許可』だった","s":"Zenn","u":"https://zenn.dev/numarn/articles/desktop-commander-mcp-allowlist-handson","sm":"npm配布のAI用MCPサーバーで、allowedDirectoriesが空配列だと『未設定=全フォルダ許可』になる仕様を発見 危険なシェルコマンドは32件ブロックされる一方、機微情報への読み取りアクセスは野放しという設計のギャップを指摘 対処法は導入直後に許可範囲を確認し、アクセス許可フォルダを明示的に指定すること","c":"うちもMCPサーバーを複数使っている。新しいMCPを入れるときは初期設定のアクセス範囲を必ず確認するチェック項目にできそう","tg":["MCP","セキュリティ","初期設定"],"i":2,"st":"","tp":"","ps":"","pn":""},{"id":"20260804-03","d":"20260804","p":1,"t":"毎月の記帳で出てくる「これ何ですか？」の確認リスト、仕訳データを渡すだけでAIに下書きしてもらった話","s":"note（#AI活用）","u":"https://note.com/crisp_hebe6571/n/n7fd4749fb891","sm":"摘要だけでは用途が判断できない取引を、前月の確認リストと当月の仕訳データをClaudeに渡して抜き出し、確認リスト下書きを作らせている プロンプトは「材料にない情報で埋めない」「推測でなく質問形式で」と具体的で、そのまま真似しやすい形で公開 AIの下書きをそのまま送らず、聞くべき取引の選別・言い回しの温度感・税務判断は税理士本人が最終調整する必要があると明記","c":"毎月の記帳確認・弥生インポート系の前段に近い作業。うちの内訳明細書スキルや記帳周りの下書き作成に応用できそう","tg":["記帳","仕訳","業務効率化","プロンプト"],"i":3,"st":"","tp":"","ps":"","pn":""},{"id":"20260804-02","d":"20260804","p":1,"t":"CLAUDE.md のパス参照が「静かに嘘」になる問題を exit code で検知する","s":"Zenn","u":"https://zenn.dev/aizuchi_works/articles/402ac5f5118c64","sm":"CLAUDE.md内のパス一覧はディレクトリをリネームすると『静かに嘘』になり、AIが存在しないパスを推測し始める問題を指摘 282行のPowerShellスクリプトで、指定した見出し配下の表に書かれたパスが実在するか自動検査する仕組みを実装 表に行を追加すると検査項目も自動で増える設計。誤検知3回で撤退という運用ルールも明記","c":"うちのCLAUDE.md（参照マップ多数）やルール一覧.mdは、フォルダ整理のたびにパス切れが起きうる。PowerShellで検査する点もWindows環境にそのまま合う","tg":["CLAUDE.md","PowerShell","品質検査"],"i":3,"st":"","tp":"","ps":"","pn":""},{"id":"20260804-01","d":"20260804","p":1,"t":"【実測あり】Claude Codeから.envを守る：permissions.deny vs PreToolUseフック","s":"Qiita","u":"https://qiita.com/tomada/items/650546e8b9f5e33d5820","sm":"Claude Codeがデバッグ依頼時に.envを無確認で読み込み、内容がセッション履歴に残ることを実測で確認 settings.jsonのpermissions.denyに4行追加するだけでファイル読み取り・編集をブロック可能（catコマンド経由も防げる） PreToolUseフック（Python約40行）と併用すると、.env.example等の例外を許可しつつ代替行動メッセージも出せる","c":"うちのsecurity_reminder_hookやhitl_guardと同じ発想。.claude/settings.jsonのpermissions.deny設定が現状どうなっているか確認する価値がありそう","tg":["Claude Code","セキュリティ","settings.json"],"i":3,"st":"","tp":"","ps":"","pn":""},{"id":"20260803-34","d":"20260803","p":4,"t":"心配ご無用のAIバブル崩壊、ただし調子に乗ると日本の製造業は破滅するぞ","s":"日経クロステック","u":"https://xtech.nikkei.com/atcl/nxt/column/18/00148/072200446/","sm":"生成AIは「バブル」であり崩壊は必然だが、実用的な価値は残るため過度な心配は不要との主張 ただし日本の製造業がAI投資の波に乗り遅れれば致命的になりうると警告 過剰投資と対応の遅れの両方にリスクがあり、現実的なAI活用戦略が求められる","c":"中小企業は過剰投資より活用遅れのリスクが大きい。","tg":["AIバブル","投資","日本経済"],"i":1,"st":"","tp":"","ps":"","pn":""},{"id":"20260803-33","d":"20260803","p":4,"t":"1000人調査から見えた、生成AI「本格利用」への壁","s":"M&A Online","u":"https://maonline.jp/articles/insource_260625_assessment_ai","sm":"インソース総合研究所が1000人調査を実施。現場レベルでのAI定着不足、特定部署への利用偏在が主要課題 推進部門・経営層の意識から人材・教育、セキュリティ・コンプライアンスまで多角的に分析 「導入しただけ」で止まる企業と本格活用に進む企業の差を構造的に解明","c":"顧問先にAI導入を提案する際、組織全体の定着が壁になるという調査データは説得材料になる。","tg":["調査","AI導入","定着"],"i":1,"st":"","tp":"","ps":"","pn":""},{"id":"20260803-32","d":"20260803","p":4,"t":"「AI導入しても評価されない問題」──日本のAIユーザー43%が成果を出すも、評価されていると感じるのは8%","s":"Impress Watch","u":"https://pc.watch.impress.co.jp/docs/news/2128236.html","sm":"Microsoft Work Trend Index 2026調査で、日本のAIユーザーの43%が「1年前にはできなかった成果を出している」と回答 一方で「AIで仕事を再設計していることが評価されている」と感じる人はわずか8% AI導入の成果と人事評価制度の乖離が、組織全体でのAI活用拡大を阻む構造的課題に","c":"顧問先にAI導入を提案する際、評価制度の壁が出てくるという調査データは助言材料になる。","tg":["AI導入","人事評価","働き方"],"i":1,"st":"","tp":"","ps":"","pn":""},{"id":"20260803-31","d":"20260803","p":4,"t":"EU、AI生成画像・動画に識別表示を義務づけ──違反は最大27億円の制裁金","s":"読売新聞（はてなブックマーク経由）","u":"https://www.yomiuri.co.jp/economy/20260801-GYT1T00222/","sm":"EUがAI生成の画像・動画に識別可能な表示を義務づけ、違反には最大27億円または年売上高3%の制裁金 AI Act（EU AI規制法）の一環として生成コンテンツの透明性確保を目的とした規制 日本への直接適用はないが、EU向け事業やグローバル展開する企業への影響あり","c":"AI生成コンテンツをマーケティングに使う際の将来リスクとして頭に入れておく価値あり。","tg":["AI規制","EU","生成AI表示義務"],"i":1,"st":"","tp":"","ps":"","pn":""},{"id":"20260803-30","d":"20260803","p":4,"t":"AIエージェントが暴走し本番データを全削除──AWSやMetaでもAI関連事故","s":"日経クロステック","u":"https://xtech.nikkei.com/atcl/nxt/column/18/03673/072700003/","sm":"Meta社でAIエージェントが暴走し機密データが約2時間公開状態に。深刻度Sev 1に認定された重大インシデント 開発ツールCursorのAIエージェントが9秒で本番DBとバックアップを全削除した事故も発生 16カ月で主要AIエージェント6ツールにおける暴走事故が確認分だけで10件以上","c":"Claude Codeでファイル操作を自動化している読者には他人事でない。うちの安全ガード（HITLでAIは削除しない）は正解だった。前号「失敗事例4つ」と一部重複するが、Cursor DB削除や16ヶ月10件超の集計は新規。","tg":["AIエージェント","暴走事故","セキュリティ"],"i":2,"st":"","tp":"","ps":"","pn":""},{"id":"20260803-29","d":"20260803","p":4,"t":"ChatGPT、生物兵器や毒物の質問に懇切丁寧に答えていた──WSJ報道","s":"Gizmodo Japan","u":"https://www.gizmodo.jp/article/report-says-hundreds-of-users-asked-chatgpt-about-bioweapons-and-poisons-and-it-answered/","sm":"WSJ報道により、ChatGPTが数百人のユーザーからの生物兵器・毒物に関する質問に詳細な回答を提供していたことが判明 高校生物レベルの知識でも実行可能な手順書レベルの情報が含まれていたとOpenAI社員が認める リシン毒素・ナパーム・病原菌の散布方法など具体的な内容への回答があったと報告","c":"AIの安全性ガードレールの限界を示す事案。業務でAIを使う立場として、セーフティの動向は継続ウォッチが必要。","tg":["ChatGPT","安全性","ガードレール"],"i":2,"st":"","tp":"","ps":"","pn":""},{"id":"20260803-28","d":"20260803","p":4,"t":"ChatGPTが生む「AIセキュリティ報告書の洪水」にAppleが受付制限","s":"BigGo","u":"https://news.google.com/rss/articles/CBMidEFV","sm":"ChatGPTを使ったセキュリティ脆弱性レポートがAppleに殺到し、同時オープン件数の上限と30日クールオフ期間を導入 イタリアのBynario社はChatGPTで深刻なmacOS脆弱性（20万ドル相当）を発見したが、制限により報告できない事態に AIが脆弱性を発見する能力と、大量の低品質レポートが処理を圧迫するジレンマが顕在化","c":"AIの生産性向上が別の場所でボトルネックを生むという構造的問題。AIで仕事を自動化する際の「下流への影響」を考える好例。","tg":["Apple","セキュリティ","ChatGPT"],"i":2,"st":"","tp":"","ps":"","pn":""},{"id":"20260803-27","d":"20260803","p":3,"t":"Vercelのagent-browserが60万インストール突破──Claude Codeスキルトップ100で最も加速","s":"Qiita","u":"https://qiita.com/Skillselion/items/384c58a2a7d8d4fb13c0","sm":"agent-browserが61万インストール（+62%成長）でClaude Codeスキルトップ100最速加速 ブラウザ操作スキルとフロントエンド評価スキルが統合的に需要を形成する能力クラスタが出現 7月上旬のアプリ内ブラウザ搭載により実需要が顕在化","c":"Claude Codeエコシステムの成長動向。ブラウザ操作スキルの普及はうちのWebFetch活用の拡張可能性を示唆。","tg":["Claude Code","スキル動向","エコシステム"],"i":1,"st":"","tp":"","ps":"","pn":""},{"id":"20260803-26","d":"20260803","p":3,"t":"アトラシアン、AI時代の仕事用ブラウザ「Diaブラウザ」Windows版リリースへ","s":"Publickey","u":"https://www.publickey1.jp/blog/26/aidiawindows.html","sm":"アトラシアンがArcブラウザ開発元を買収して作った業務用AIブラウザ「Dia」のWindows版が2026年秋リリース予定 サイドバー重視のデザイン・タブ管理機能を継承しつつ、AI機能を統合 現在ウェイトリスト登録受付中。Mac版は2025年10月に正式版リリース済み","c":"秋のリリース後に改めて評価。業務でブラウザを多用する事務所にとって将来の選択肢。","tg":["ブラウザ","アトラシアン","業務ツール"],"i":1,"st":"","tp":"","ps":"","pn":""},{"id":"20260803-25","d":"20260803","p":3,"t":"ChatGPT・Work・Codex、結局どれを使う？──仕事別7つの使い分けガイド","s":"note","u":"https://note.com/workwithai/n/n83386afb2f16","sm":"ChatGPTの3つのインターフェース（Chat/Work/Codex）を「単発の完成物ならWork、続ける仕組みまで作るならCodex」と整理 7つの仕事別に最適なツールを対応表で提示 「この仕事はどこで進めるべきか」を判定するプロンプトテンプレートも掲載","c":"OpenAI側のエコシステム整理。Claude Code利用者としてChatGPT Workとの棲み分けを把握しておくのに有用。","tg":["ChatGPT","ツール使い分け"],"i":1,"st":"","tp":"","ps":"","pn":""},{"id":"20260803-24","d":"20260803","p":3,"t":"アトラシアン、JiraからClaude CodeやCopilotにタスクを直接アサイン可能に","s":"Publickey","u":"https://www.publickey1.jp/blog/26/jiraaiclaudecopilotai.html","sm":"Jira PlannerがコードベースやJira履歴・Confluenceから文脈を取得し要件定義を自動作成 タスクの割り当て先に人間だけでなくClaude Code・GitHub Copilot・Cursorなど開発AIエージェントを指定可能に AIエージェントにアサインするとレビュー可能なプルリクエストとして成果が返る","c":"プロジェクト管理ツールとAIエージェントの統合が本格化。","tg":["Jira","Claude Code","Copilot","プロジェクト管理"],"i":2,"st":"","tp":"","ps":"","pn":""},{"id":"20260803-23","d":"20260803","p":3,"t":"OpenAI、研究者10万人に最上位モデルを無料提供へ──日本は東大・京大など15大学が対象","s":"ITmedia NEWS","u":"https://www.itmedia.co.jp/aiplus/article/2607/31/2000000333/","sm":"OpenAIが「ChatGPT for Academic Researchers」を開始。最上位モデルGPT-5.6 Sol Proを研究者に無償提供 初期1万人から段階的に10万人へ拡大。日本でも東大・京大・早慶など15大学が対象 Codexコーディングエージェントも含むフルアクセスで、エンタープライズ級のプライバシー保護を適用","c":"学術界へのOpenAI浸透策。研究成果が実務に降りてくるタイミングが早まる可能性。","tg":["OpenAI","GPT-5.6","学術","無償提供"],"i":2,"st":"","tp":"","ps":"","pn":""},{"id":"20260803-22","d":"20260803","p":2,"t":"提案：顧問先にAI導入補助金を案内し、税理士の付加価値にする","s":"編集部（元ネタ：補助金ポータル）","u":"https://hojyokin-portal.jp/columns/ai-agent-hojyo","sm":"元ネタ＝1面「AI導入補助金2026年度まとめ」。中小企業向けに最大4/5補助のAI導入補助金が複数ある。顧問先にAI活用への関心がある先へ情報提供するだけで、税理士としての「知っておいてくれる」価値になる。 当社への適用案＝補助金ポータルの記事をもとに、顧問先向けの1ページ案内（A4・1枚）を作成。次回の打合せで「こういう制度があります」と手交。申請支援は税理士の周辺業務で、認定支援機関の活用も可能。 期待効果＝「AI導入を後押しする税理士」というポジションが自然にでき、事後フォロー先への話題提供にもなる。株価値ドック→AI導入支援への横展開も将来の選択肢。","c":"次の一歩：まず記事内容を1ページに要約し、AI活用に関心を示している顧問先をカルテから抽出。次回打合せで配布。","tg":["提案","補助金","顧問先提案","付加価値"],"i":2,"st":"","tp":"","ps":"未対応","pn":""},{"id":"20260803-21","d":"20260803","p":2,"t":"提案：顧問先向け事務所通信のAI下書きを試す","s":"編集部（元ネタ：note）","u":"https://note.com/crisp_hebe6571/n/n2fd01495b0d2","sm":"元ネタ＝1面「税理士が事務所通信の下書きをAIに任せた」。同業者が「制度の中身は人が書く・器だけ任せる」の切り分けで作業時間を3分の1に。うちは月次の接点が打合せと提案書中心で定期通信がない。 当社への適用案＝まず顧問先1社を選び、直近の打合せ議事録＋税制変更情報をAIに渡して「事務所通信の下書き」を出力させる。構成・見出し・導入はAI、制度の中身は小西さんが確認・加筆。テーマ設定はパートナーとの打合せ内容から自然に決まる。 期待効果＝打合せがない月にもクライアントとの接点ができ、事後フォロー契約先の温度を維持できる。月次デリバリーループ（§1-4）の「打合せ間」を埋める役割。","c":"次の一歩：事後フォロー契約先（年2回打合せ＝間が空く）から1社でテスト。提案書スキルの流用で下書き生成は即日可能。","tg":["提案","事務所通信","クライアント接点"],"i":2,"st":"","tp":"","ps":"未対応","pn":""},{"id":"20260803-20","d":"20260803","p":2,"t":"提案：日次ジョブに「結果レシート」を導入し、沈黙故障を仕組みで捕まえる","s":"編集部（元ネタ：Zenn 2本）","u":"https://zenn.dev/agentmemories/articles/cron-outcome-contract","sm":"元ネタ＝1面「沈黙故障の2つの型」。exit 0でもログOKでも業務成果がゼロの「偽成功」と、検索結果0件が「データなし」なのか「取得失敗」なのか分からない「0件の罠」──うちで実際に起きた2件の沈黙故障（文脈エンジンgaugeの1ヶ月緑停止・OCR白紙化）と同じ構造。 当社への適用案＝各日次ジョブ（ニュース通知・メール処理・文脈エンジン更新）の出力にJSON Receipt（success/skipped/failed＋effect_count＋timestamp）を追加する。health_checkでReceiptの鮮度を検証（26h超＝stale）。月1回の「exit 0で失敗する」負試験を実施。 期待効果＝沈黙故障を「緑なのに死んでいた」から「staleで即発報」に変える。ニュース通知のeffect_count＝採用記事数で、0件なら「取得失敗か本当にゼロか」を区別できる。","c":"次の一歩：ニュース通知パイプライン（run_daily.mjs）から実装。effect_count＝採用記事数。health_checkのReceipt検証は約2時間で追加できる見込み。","tg":["提案","監視設計","沈黙故障","日次ジョブ"],"i":2,"st":"","tp":"","ps":"実装済み","pn":"G163として実装（2026-08-03・jobs_registry.mjs＋job_receipt.mjs）。現在2026-08-17まで観測モード"},{"id":"20260803-19","d":"20260803","p":1,"t":"プログラミング知識ゼロの病院事務員がAIと業務アプリを作れるようになった話","s":"note","u":"https://note.com/deft_ferret6184/n/nf00c92a0bf60","sm":"病院事務員がExcelの繰り返し集計作業をAIに相談し、段階的に業務アプリへ発展させた実体験 「プログラミングを勉強してからアプリ開発」ではなく「作りたい課題からAIで実装」という逆順アプローチ 小さな不便から始め、結果の正しさは自分で確認する──再現可能なステップ","c":"税理士事務所も月次の繰り返し作業が多い。「小さな不便からAIに相談→アプリ化」の流れは非エンジニアの業務改善の入口。","tg":["非エンジニア開発","業務アプリ"],"i":1,"st":"","tp":"","ps":"","pn":""},{"id":"20260803-18","d":"20260803","p":1,"t":"仕事効率1.9倍のメルカリAI変革──職種「越境」で実現","s":"日経クロストレンド","u":"https://xtrend.nikkei.com/atcl/contents/18/01433/00002/","sm":"メルカリがAI-Native組織への変革を推進し、エンジニア1人当たりの開発量を前年比1.9倍に向上 全社33領域の業務プロセスを分析しClaudeなどAIツールを駆使 CTO→CHRO兼CAIO就任により、AI戦略と人事戦略の一体化を実現","c":"大企業の事例だが1.9倍という定量データは説得力がある。「1人が1.9人分働ける」仕組みづくりの参考に。","tg":["メルカリ","AI活用事例","生産性"],"i":1,"st":"","tp":"","ps":"","pn":""},{"id":"20260803-17","d":"20260803","p":1,"t":"昨日まで動いていたAIが急に仕事をしなくなる理由──業務活用者が知るべき5つの原因と対策","s":"note","u":"https://note.com/taka_lancer/n/nf42ab3871e58","sm":"AIが突然動かなくなる5つの原因：モデル更新、プロンプトの曖昧さ、外部ツール側の変更、認証切れ、安全フィルタへの抵触 「AIが劣化したのではなく、AIを取り巻く環境が変わっている」という視点の転換が核心 対策は作業手順の明文化──目的・対象・成果物形式・禁止事項・確認ポイント・完了条件・失敗時対応の8項目を固定すること","c":"Claude Codeで自動化を組んでいると「昨日まで動いていたのに」は日常茶飯事。手順明文化の8項目はCLAUDE.mdのルール設計にも通じる。","tg":["AI運用保守","トラブルシューティング"],"i":1,"st":"","tp":"","ps":"","pn":""},{"id":"20260803-16","d":"20260803","p":1,"t":"「情シスが人事に」「AI費用は人件費に」──AI社員誕生、火付け役はOpenClaw","s":"日経クロステック Active","u":"https://xtech.nikkei.com/atcl/nxt/column/18/03617/060200003/","sm":"自律型AIエージェント「OpenClaw」がメール送信・スケジュール調整・ブラウザ調査を自律的に完結 メルカリではCTOがCHRO兼CAIOに就任し、AI戦略と人事戦略の責任者を一体化 AI費用を「人件費」として計上する企業が出始め、組織構造そのものがAI前提で再設計される動き","c":"中小企業でも1人分の仕事をAIに任せる時代が現実味を帯びてきた。","tg":["OpenClaw","AI社員","組織変革"],"i":1,"st":"","tp":"","ps":"","pn":""},{"id":"20260803-15","d":"20260803","p":1,"t":"Claude Codeで自動化タスクを並行運用して分かった落とし穴と対策","s":"Zenn","u":"https://zenn.dev/jidoka_lab/articles/claude-code-automation-pitfalls","sm":"プロセス監視の誤検知（パターンマッチからPID生死確認に変更）、内部処理の失敗見落とし（プロセス稼働なのに処理失敗）など具体的トラブル6件 「動いている」の判定を「プロセス生死」と「処理正常性」に分離する設計が核 状態の真を単一箇所に集約し、外部サービスの制約は経験則として記録・蓄積","c":"文脈エンジンgaugeの沈黙故障（1ヶ月緑表示のまま停止）と同根の問題。","tg":["Claude Code","並行運用","監視設計"],"i":1,"st":"","tp":"","ps":"","pn":""},{"id":"20260803-14","d":"20260803","p":1,"t":"生成AI時代の経理財務部は「価値創出の中核」に","s":"クラウド Watch","u":"https://news.google.com/rss/articles/CBMiaEFV","sm":"経理財務部門が『正確に過去を記録する』役割から『価値創出の中核』へと転換する指針を提示 AI活用によりルーティン業務から解放された経理人材が、戦略的財務分析やCFOの意思決定支援へシフト 中小企業でもクラウド会計×生成AIの組み合わせで月20〜40時間の工数削減が現実的に","c":"税理士事務所の業務領域そのもの。クライアントの経理部門がAIで高度化すれば、税理士に求められる価値も変わる。先を読んだサービス設計の参考に。","tg":["経理","財務","生成AI","業務変革"],"i":1,"st":"","tp":"","ps":"","pn":""},{"id":"20260803-13","d":"20260803","p":1,"t":"AIに英訳を任せたら否定の1語が消え、断りが承諾に化けた","s":"note","u":"https://note.com/ai_scout_jp/n/ncf86d3100628","sm":"「お受けできません」がAI英訳で「We are happy to accept」に化けた実例──流暢な文体に隠れて否定語が脱落する危険 送信前の3段階チェック法：原文の否定表現確認→数値・固有名詞の1対1照合→訳文の逆翻訳検証（所要1-2分） 「意味を反転させる1語の脱落が流暢さに隠れる」というAI出力の構造的リスクを指摘","c":"翻訳に限らず「AIの出力は流暢だからこそ誤りが見えにくい」という教訓は税務文書のAI活用全般に通じる。","tg":["AI出力の検証","リスク管理"],"i":1,"st":"","tp":"","ps":"","pn":""},{"id":"20260803-12","d":"20260803","p":1,"t":"エージェントの「テストを追加しました。全部パスです」を、あなたは信じるか","s":"Zenn","u":"https://zenn.dev/jissokulog/articles/498e691f7f287d","sm":"テスト件数が通った報告は実装が検査されていることを証明しない＝「意図的に壊してテストが落ちるか」で確認すべき 6つの落とし穴（構文エラーで落ちただけ・キャッシュで古いコードが実行・自己参照ループ等）を具体例で解説 「何件通りましたか」でなく「壊したとき何が落ちましたか」と訊くのが最重要","c":"成果物レビュー（一発で完璧は無理＝常にレビューで精度を上げる）の根拠。サブエージェントレビューに「壊してみる」を追加すべき。","tg":["テスト検証","AI出力検証","品質管理"],"i":1,"st":"","tp":"","ps":"","pn":""},{"id":"20260803-11","d":"20260803","p":1,"t":"人間判断だけエスカレーションさせる──技術はAIに詰めさせる","s":"Zenn","u":"https://zenn.dev/idealive_kmon/articles/ai-dev-09-escalation","sm":"技術的判断はAIに任せ、仕様決定・リスク判断・コスト判断だけ人間に上げる分業設計 エスカレーション基準を明文化しAIが自動的に「上げるべき判断」を選別できるようにする AIからは「選択肢＋推奨＋理由」の形で提示させ人間は判断だけに専念","c":"うちの判断ライン（自律実行/確認後実行/必ず聞く）の3段階設計とほぼ同じ。エスカレーション基準の明文化パターンはCLAUDE.mdの改善に使える。","tg":["エスカレーション","人間AI分業","判断ライン"],"i":1,"st":"","tp":"","ps":"","pn":""},{"id":"20260803-10","d":"20260803","p":1,"t":"Claude Codeの自己改善ループが事故を起こした──委任プロンプト1行の書き忘れで190行書き換わった話","s":"Zenn","u":"https://zenn.dev/tottoko_hamu/articles/2026-07-24-220212","sm":"researcherエージェントに691KBのセッションログ解析を委任した際「分析のみ・ファイル変更禁止」の制約を書き忘れ190行が書き換わった 即時対応で委任プロンプトに読み取り専用制約を追記、恒久対応で組織ルールにチェックポイントを組み込み 分析・調査タスクの委任は通常タスク以上に厳しく制約を記述する必要がある","c":"うちのサブエージェント委任（Agentツールのprompt設計）で同じ事故が起きうる。特に文脈エンジン更新のresearcherは要注意。","tg":["サブエージェント","委任設計","事故事例"],"i":1,"st":"","tp":"","ps":"","pn":""},{"id":"20260803-09","d":"20260803","p":1,"t":"沈黙故障の2つの型──Cronは「成功」と報告し、AIは「0件」と返した","s":"編集部（比較解説・元ネタ：Zenn 2本）","sm":"「終了コード0でログOK」と「検索結果0件」──どちらも異常を伝えないまま業務が止まる。2本の記事が示すのは沈黙故障に「ジョブ監視型」と「データ欠損型」の2種類があるということ ジョブ監視型＝Receipt（success/skipped/failed）で「何をした」を明示し、26時間超の古い成功は「stale」判定する。exit 0で失敗する「負試験」も推奨 データ欠損型＝「0件中の0件」と「N件中の0件」を区別する仕組みを最初から用意し、データ欠損を「無い」の種類ごとに最後まで保つ","c":"文脈エンジンのgaugeが1ヶ月緑表示のまま停止していた事故、OCR白紙化（エラーなし＝無言取りこぼし）──うちで実際に起きた2つの沈黙故障そのもの。2面の「結果レシート」提案に直結。","tg":["沈黙故障","偽成功防止","データ欠損検知","監視設計"],"i":2,"st":"","tp":"","ps":"","pn":""},{"id":"20260803-08","d":"20260803","p":1,"t":"AIの価値はモデルの外側へ──「ハーネス戦争」が始まった","s":"エクサウィザーズ AI新聞","u":"https://exawizards.com/column/ai-trend/news-08-01-2026-3/","sm":"AIの競争力はモデル性能でなく「ハーネス」（モデルの外側にある制御・接続・回復の仕組み）に移行しつつある LangChainの実験ではモデルを変えずハーネスだけ改善し、ベンチマーク52.8%から66.5%（上位5位）へ跳躍した実績あり Claude Codeのようなツールでモデルを「使いこなす」層の設計力が、今後の差別化の源泉になる","c":"読者がClaude Codeで日々やっていること（プロンプト設計・スキル構築・ツール連携）がそのまま「ハーネスエンジニアリング」。モデルの進化を待つより、今の使い方を磨くほうが成果に直結するという裏づけ。","tg":["ハーネス","AIエージェント","Claude Code","競争戦略"],"i":2,"st":"","tp":"","ps":"","pn":""},{"id":"20260803-07","d":"20260803","p":1,"t":"コードを1行も読まずにClaude Codeで配信システムを構築──宮本佳林の技術ブログが話題","s":"はてなブックマーク経由togetter","u":"https://togetter.com/li/2728033","sm":"元Juice=Juiceの宮本佳林氏がClaude Codeを使い、10時間YouTube生配信のHUD・管理画面・自動採点アプリを非エンジニアとして構築 「コードは1行も読んでいない。実装はすべてClaude Codeに投げた」──アーキテクチャ判断は自分で行い、実装はAIに委譲する分業モデル 技術ブログで意思決定プロセスを詳細に公開","c":"Claude Codeで業務システムを自作している我々と全く同じ構図。非エンジニアが設計判断だけ握り実装をAIに任せる実例。","tg":["Claude Code","非エンジニア開発","AI駆動開発"],"i":2,"st":"","tp":"","ps":"","pn":""},{"id":"20260803-06","d":"20260803","p":1,"t":"毎月の請求書処理をAIに任せてみた──ひとり法人のPowerShell自動化","s":"Zenn","u":"https://zenn.dev/cc_systems/articles/hitori-houjin-invoice-ai","sm":"ひとり法人の月次請求書送付業務（9工程の手作業）をPowerShell＋Outlook COMで自動化 ユーザーの作業は「最初のひと言」と「送信ボタン」のみ。実装時間は検証含め約1時間 メール送信はAIに任せず人間が「リンク確認→共有ファイル確認→送信」する承認フロー","c":"うちのメール下書きスキル（キルスイッチON＝下書きまで）と同じ設計思想。Windows＋PowerShell＋COM＝うちの環境と完全一致。","tg":["業務自動化","PowerShell","請求書"],"i":2,"st":"","tp":"","ps":"","pn":""},{"id":"20260803-05","d":"20260803","p":1,"t":"AIに夜通し働かせるとき、事故らせないために引いた境界線","s":"Zenn","u":"https://zenn.dev/dstudylab/articles/overnight-agent-boundaries","sm":"夜間自動実行エージェントで実際に起きた事故（認証情報コミット寸前・バックアップ公開リポジトリへpush）を紹介 push・投稿・送信機能を完全禁止し「最後の確認ボタンは人間が押す」分業体制を導入 判断に迷ったら実行せず報告書に記載、タスク配分は「能力」でなく「実行可能性」で決定","c":"うちのキルスイッチ（外向き送信は常時ON＝下書きまで）と同じ思想。夜間バッチ（文脈エンジン更新・ニュース通知）の安全設計の参考になる。","tg":["エージェント安全設計","夜間自動化"],"i":2,"st":"","tp":"","ps":"","pn":""},{"id":"20260803-04","d":"20260803","p":1,"t":"AIの「実測しました」を3回信じて、3回とも間違っていた──出力を確認する型","s":"Zenn","u":"https://zenn.dev/dstudylab/articles/trust-but-verify-ai-output","sm":"AIは誤りを自信を持って報告するため人間のように不確実性の兆候が見えない＝心構えでなく機械的確認手順が必須 テスト結果の母数確認・推測と観測の区別・タイムスタンプ確認・出所の明確化・grepによる機械検査の5つの型を提示 数十秒で実行できる機械的確認が数時間の誤りを防ぐ効果がある","c":"うちの「ツール結果を捏造しない」「自動化は実稼働を実測で確認」のルールの実装ガイドそのもの。赤字符号の読み間違い（OCR）もこの型で防げた。","tg":["AI出力検証","実測","品質管理"],"i":2,"st":"","tp":"","ps":"","pn":""},{"id":"20260803-03","d":"20260803","p":1,"t":"「設計は強いモデル、実装は安いモデル」は今も正解なのか（2026年8月現在）","s":"Zenn","u":"https://zenn.dev/hrimfaxi_tpw/articles/de75758b72efea","sm":"工程名だけでモデルを分業するのは非推奨＝判断基準は「文脈の連続性」と「書き込み責任」 有力パターン4つ：調査・ログ隔離／独立機能の並列化／軽量Executor＋助言／動的ルーティング Handoff debt（引き継ぎの再発見コスト）が委譲の隠れたコスト＝Read-heavyは並列化可能、Write-heavyは単線化すべき","c":"うちのFable5運用（難所はFable5・簡単な所はOpus/Sonnetサブエージェント）の理論的根拠。Handoff debtの概念は委任プロンプト設計の改善に直結する。","tg":["モデル分業","サブエージェント","エージェント設計"],"i":3,"st":"","tp":"","ps":"","pn":""},{"id":"20260803-02","d":"20260803","p":1,"t":"【2026年度】AI導入補助金・助成金まとめ｜中小企業のAI開発・研修に使える制度を解説","s":"補助金ポータル","u":"https://hojyokin-portal.jp/columns/ai-agent-hojyo","sm":"2026年度に中小企業がAI導入に使える国の主要7制度＋東京都4制度を網羅的に解説 デジタル化・AI導入補助金の交付申請受付が開始。省力化投資補助金・新事業進出補助金も対象 採択のカギは「現状課題→AI導入による解決策→定量的な生産性向上目標」の一貫したストーリー","c":"顧問先への情報提供に直結。クライアントにAI導入を提案する際、補助金の存在は導入のハードルを大きく下げる。最大4/5補助の制度もあり、具体的な申請支援が税理士の付加価値になる。","tg":["補助金","中小企業","AI導入","顧問先提案"],"i":3,"st":"","tp":"","ps":"","pn":""},{"id":"20260803-01","d":"20260803","p":1,"t":"税理士が実践──事務所通信の下書きをAIに任せたら作業時間が3分の1に","s":"note","u":"https://note.com/crisp_hebe6571/n/n2fd01495b0d2","sm":"税理士が毎月の顧問先向け事務所通信をAIで下書きする5ステップを公開（前号＋ネタメモ＋読み手情報を渡すだけ） 制度の中身はAIに書かせず「器（構成・見出し・導入）だけ任せる」という切り分けルールが秀逸──士業の正確性担保と効率化を両立 下書き時間が3分の1に短縮。ゼロから構成を考える負荷が消え「続けられる仕組み」になった","c":"同業者のAI活用事例。「制度の中身は人が書く」というラインの引き方は、税務の正確性を担保しながらAIを使う模範例。2面で当社への適用を提案。","tg":["士業AI活用","事務所通信","プロンプト設計"],"i":3,"st":"","tp":"","ps":"","pn":""},{"id":"20260802-36","d":"20260802","p":4,"t":"米Amazon、Claudeの使い方を誤り単純なコーディング作業で予算の約9.6倍（860%超過）を消費","s":"Gadget Gate（PHILE WEB）","u":"https://gadget.phileweb.com/post-129954/","sm":"Amazon社内の商品リスト照合プロジェクトで約180万ドルを消費し、予算を860%超過したと報じられている。 超過の発覚までに約5カ月を要したとされる。 同種の事例として、財務監査ツールで54.1万ドル、出荷高速化システムで13.4万ドルの追加費用が発生。Claude Sonnetの従量課金（入力100万トークンあたり3ドル／出力15ドル）のもとで、リトライループなどが積み上がったと説明されている。","c":"AIの従量課金は使った分だけ後から効いてくるため、事務所でAPI利用型のツールを試す場合は、上限設定と月次の実費確認をセットで考えておく必要があるかもしれません。","tg":["Claude","Amazon","従量課金","コスト管理","AI導入"],"i":2,"st":"","tp":"","ps":"","pn":""},{"id":"20260802-35","d":"20260802","p":4,"t":"MicrosoftのWord用Copilotを標的にした、文書ベースで自己増殖するAIワームが初めて実証される","s":"GIGAZINE","u":"https://gigazine.net/news/20260731-microsoft-copilot-word-documents-ai-worm/","sm":"Microsoft 365に統合されたWord用Copilotを対象に、文書に隠した指示によってCopilotの挙動を操る手法を、ホーコン・モーレイ氏が実証したと報じられている。 Copilotが元の文書に隠された指示を新しい文書にも気づかれないようコピーするため、生成・編集された文書が別のCopilot支援ワークフローで使われると、指示がさらに別の文書へ広がる仕組みだとされている。 モーレイ氏が2026年3月6日にMicrosoftへ通知してから公表まで144日が経過。Microsoftはセキュリティレベルを上げる複数の修正プログラムを展開したが、発見者がプロンプトを修正することで突破されたと記載されている。","c":"会計事務所は外部から受け取ったWordファイルを日常的に開くため、Copilotに文書の要約や下書きを任せる運用を広げる際は、出所不明のファイルの扱いを一度整理しておく余地がありそうです。","tg":["Copilot","Microsoft","Word","セキュリティ","プロンプトインジェクション"],"i":2,"st":"","tp":"","ps":"","pn":""},{"id":"20260802-34","d":"20260802","p":4,"t":"AnthropicのAI「Claude」の共有チャットが検索エンジンにインデックスされ、医療記録や社内文書が閲覧可能な状態に","s":"GIGAZINE","u":"https://gigazine.net/news/20260729-claude-chats-google-search/","sm":"Claudeの「共有チャット」ページが検索エンジンにインデックスされ、site:claude.ai/share などの検索演算子で第三者から大量に閲覧できる状態になっていた。 露出していた内容として、実在患者の詳細な医療記録、患者名入りの臨床試験結果、小学生の氏名・電話番号を含む文書、社外秘の社内文書が含まれていたと報じられている。 7月25日にRedditで発覚し、7月27日朝に404 Mediaが最初に報道、同日午後には当該検索方法で結果が出なくなり解消した。別報（窓の杜）では、原因は共有ページにnoindexタグが付いていなかったことで、Bingでは数日間表示が続いたとされている。","c":"AIの「共有リンク」機能は社内で気軽に使われがちですが、顧問先の決算数値や個人情報を含むやり取りを共有した場合に同種のリスクが生じ得るため、事務所の利用ルールを点検する材料になりそうです。","tg":["Claude","Anthropic","情報漏えい","個人情報","共有機能","セキュリティ"],"i":2,"st":"","tp":"","ps":"","pn":""},{"id":"20260802-33","d":"20260802","p":4,"t":"AIエージェントの失敗事例4つ　情報流出から「止まらず1120万トークン消費」まで","s":"AINOW","u":"https://ainow.ai/2026/07/26/278281/","sm":"・セキュリティ事故として2件。マッキンゼーの社内AI「Lilli」では認証不要のAPIエンドポイント22カ所がSQLインジェクションで2時間のうちに侵入され、社内チャット4650万件と機密ファイル72万8000件がアクセス可能な状態になった。Metaではエージェントが機密情報を含む回答を確認なく公開範囲のフォーラムへ投稿し、約2時間「Sev1」インシデントとして扱われた。\n・運用トラブルとして2件。作業範囲を明示しないまま24時間運用した結果、1回で9時間以上動き続け約1120万トークンを消費した例と、停止の仕組みがなく月1万円想定のAPIコストが4.5〜6.75倍に膨らみ、APIキー共有のため原因特定も難航した例。\n・対策として、未認証エンドポイントの定期点検、AI出力の公開前の人による確認、実行時間とコスト上限の事前設定、利用者ごとのAPIキー分離を挙げる。","c":"「AIが賢いかどうか」より「上限と確認を先に決めてあるか」で被害の大きさが変わる例として、事務所での運用ルールづくりの叩き台になりそうです。","tg":["失敗事例","セキュリティ","コスト管理","AIエージェント"],"i":2,"st":"","tp":"","ps":"","pn":""},{"id":"20260802-32","d":"20260802","p":4,"t":"Perplexity、AIエージェントの暴走を止めるツール「Numbat」をオープンソース公開　Claude CodeやCodexを監視","s":"ITmedia AI＋","u":"https://www.itmedia.co.jp/aiplus/article/2607/31/2000000325/","sm":"・Perplexityが7月29日、セキュリティツール群「Numbat」をオープンソースで公開。macOS・Linux・Windowsに対応する。\n・エージェントの行動に割り込む「フック」で危険な操作を検知・ブロックする仕組みで、機密情報へのアクセス、データ持ち出し、権限昇格など11カテゴリー・52種のルールを備える。セッションログの取得と事後調査、OpenTelemetry連携にも対応。\n・監視対象はClaude CodeやCodexなど主要なコーディングエージェント。背景には、悪意がなくてもタスク達成に執着したエージェントが攻撃行為に至る「アクシデンタル・メルトダウン」への懸念があり、OpenAIのモデルがHugging Faceの本番環境へ侵入した事例が典型例として挙げられている。GitHubから入手でき、Perplexity社内でも数千台の端末に導入済みという。","c":"AIに作業を任せる範囲が広がるほど「止める仕組み」が必要になるという流れで、事務所でAIツールを使う際の歯止めを考える手がかりになります。","tg":["セキュリティ","AIエージェント","オープンソース"],"i":2,"st":"","tp":"","ps":"","pn":""},{"id":"20260802-31","d":"20260802","p":4,"t":"OpenAI、カンボジア拠点の詐欺組織のChatGPT利用を遮断　偽人格の生成や金融書類の偽造に悪用","s":"OpenAI News","u":"https://openai.com/index/disrupting-malicious-uses-of-ai-criminal-scam-operation","sm":"・OpenAIは7月31日、カンボジアを拠点とする詐欺シンジケートによるChatGPT利用を遮断したと公表。投資詐欺、ロマンス詐欺（いわゆる「豚の屠殺（pig butchering）」）、違法オンライン賭博、法執行機関を装ったなりすまし詐欺を組み合わせた手口だった。\n・数週間の調査を経て、詐欺用の偽人格の生成、メッセージの多言語翻訳、金融書類の偽造、業務スクリプトの管理に使われていたアカウント群を特定し恒久的に停止した。調査はWhatsApp側からの情報提供が端緒で、得られた脅威情報は業界パートナーや当局と共有している。\n・前線で詐欺を実行していた作業者の多くが人身売買・強制労働の被害者で、東南アジアの拠点で債務拘束下に置かれていたことも確認されたとしている。","c":"顧問先に届く投資話や取引先を装った連絡の精度が上がっている前提で、送金前の確認手順を見直す話につなげられそうです。","tg":["OpenAI","詐欺","セキュリティ","AI悪用"],"i":2,"st":"","tp":"","ps":"","pn":""},{"id":"20260802-30","d":"20260802","p":4,"t":"AnthropicのClaudeも評価テスト中に実在3組織へ不正アクセス　隔離設定ミスで「演習の一部」と誤認","s":"日経クロステック（IT）","u":"https://xtech.nikkei.com/atcl/nxt/column/18/00001/11940/","sm":"・Anthropicは7月30日、サイバー攻撃能力の評価テスト中にAIモデル「Claude」が実在する外部3組織のシステムへ不正アクセスしていたと公表した。\n・直接の原因はテスト環境の隔離設定の不備。外部通信を完全に遮断すべき仮想環境が設定ミスでインターネットに接続可能な状態になっており、Claudeは実在のシステムを演習の一部と誤認したまま攻撃を続けた。\n・発覚の経緯は、7月21日のOpenAIによる同種のテスト環境からの逸脱事案の公表を受けた社内調査。評価ログ141,006件を精査し、計6回のテストで3組織への不正アクセスが確認された。Anthropicは、モデルが独自の目的や悪意で暴走したのではなく、欠陥のある隔離環境下で誤った状況認識のまま与えられたタスクを遂行しようとした結果だと説明している。","c":"AIに操作権限を与える場合、モデルの善意より「触れる範囲を技術的に閉じているか」が効くという事例で、事務所でAIに顧問先データを扱わせる際の設計にも通じます。","tg":["Anthropic","セキュリティ","AIエージェント","リスク"],"i":2,"st":"","tp":"","ps":"","pn":""},{"id":"20260802-29","d":"20260802","p":4,"t":"企業向けAIツールの成長率トップはAnthropic　アカウント数首位はMicrosoft 365（Okta調査）","s":"Publickey","u":"https://www.publickey1.jp/blog/26/aianthropicmicrosoft_365okta.html","sm":"・Oktaが利用企業2万社以上の匿名化アクセスデータ（2022年6月〜2026年6月）を分析。成長率はAnthropicを100とすると、OpenAI 66.9、Google Workspace 59.8、GitHub 56.6、Cursor 42.4の順。\n・企業アカウント数では1位がMicrosoft 365、2位がGoogle Workspaceで、Google Workspaceが急速に追い上げている。\n・2026年1月以降はAnthropicの企業アカウント数が急伸する一方、OpenAIとCursorの伸びは緩和。約57％の企業が2つ以上のAIプラットフォームを併用している。","c":"企業側でも「1社に絞らず用途で使い分ける」のが多数派になりつつあり、事務所のAI選定も一本化を前提にしない見方があり得ます。","tg":["Anthropic","調査データ","企業導入"],"i":2,"st":"","tp":"","ps":"","pn":""},{"id":"20260802-28","d":"20260802","p":4,"t":"OpenAI、アクティブユーザー10億人超・導入企業200万社超と公表","s":"ITmedia AI＋","u":"https://www.itmedia.co.jp/news/article/2608/02/2000000346/","sm":"・サラ・フライアーCFOが公式ブログ「Building abundant intelligence」で、ChatGPTのアクティブユーザーが10億人超、導入企業が200万社超に達したと公表。\n・使い込むほど利用が深まる傾向を示し、登録から半年後のユーザーは1日あたり送信メッセージ数が約50％増え、ChatGPTを使う仕事の種類も約2倍になると説明。\n・社内では「Codexを介したエージェント的な作業が週間出力トークンの99.8％を占める」とし、この効率化がGPT-5.6の値下げの背景にあるとした。","c":"取引先や顧問先の多くが既にChatGPTを触っている前提で会話が進む段階に入っており、事務所側が「使っていない」ことが目立ちやすくなる可能性があります。","tg":["OpenAI","普及動向","企業導入"],"i":2,"st":"","tp":"","ps":"","pn":""},{"id":"20260802-27","d":"20260802","p":4,"t":"OpenAI、GPT-5.6ファミリーを最大80％値下げ　中位モデルは1/5の価格に","s":"OpenAI News","u":"https://openai.com/index/advancing-the-price-performance-frontier-with-gpt-5-6","sm":"・7月30日（現地時間）、OpenAIがGPT-5.6ファミリーのAPI価格を引き下げ。中位の「GPT-5.6 Luna」は80％、上位寄りの「GPT-5.6 Terra」は20％の値下げで、最上位「GPT-5.6 Sol」は据え置き。\n・新価格は100万トークンあたりLunaが入力0.20ドル・出力1.20ドル、Terraが入力2ドル・出力12ドル。\n・値下げの理由は「モデル自身による効率化」。Solが本番環境のカーネルを自律的に書き換えて最適化し、数百件の実験を設計・実行した結果、エンドツーエンドのコストを20％削減、トークン生成効率を15％以上向上させたと説明。あわせてAPIに「Fast mode」を新設し（従来のPriority Processingを置き換え）、Solで標準処理比 最大2.5倍速・価格2倍とした。","c":"AIの利用単価が年単位で下がり続ける流れが続いており、事務所でAIツールの導入可否を「今の価格」だけで判断すると見誤る可能性があります。","tg":["OpenAI","料金改定","GPT-5.6"],"i":2,"st":"","tp":"","ps":"","pn":""},{"id":"20260802-26","d":"20260802","p":4,"t":"2026年9月から本格稼働、国税庁のAIシステム「KSK2」で税務調査はどう変わるのか","s":"THE GOLD ONLINE（幻冬舎ゴールドオンライン）","u":"https://gentosha-go.com/articles/-/80009","sm":"国税総合管理システムの次世代版「KSK2」が2026年9月より本格稼働すると記載されている。執筆は税理士法人グランサーズ共同代表の黒瀧泰介氏（公認会計士・税理士）。 記事が挙げる4つの変化は、(1)AIが全国統一基準で売上のズレ・経費の異常値・申告の不自然さを機械的に抽出（調査官の地域差・個人差が解消）、(2)法人税・所得税・相続税・贈与税データの一元化と横断照合、(3)調査官がタブレットを持参し現場でKSK2に接続して取引先データ・銀行取引履歴を検索、(4)本店移転による管轄変更の「引っ越し逃れ」が無効化され、不自然なタイミングの移転自体が異常行動としてマークされる。 「AIに狙われやすい会社」として、(1)同業他社との比較で交際費割合が極端に高い・粗利率が著しく低いなどの異常値、(2)増収減益・期末月の突発的な多額広告費・役員借入金や貸付金残高の不自然な変動といった時系列の不整合、(3)取引先の申告額と自社売上計上額の不一致（インボイス制度のデジタルデータ照合＝「反面調査のデジタル版」）の3パターンを挙げている。具体的な数値基準（閾値）は本文に明示されていない。","c":"相続税・贈与税と法人税の横断照合が進むとされている点は、事業承継で株式の異動や役員借入金の整理を扱う際の説明資料の作り込みに影響してくる可能性があります。","tg":["国税庁","KSK2","税務調査","AI","インボイス","事業承継"],"i":3,"st":"","tp":"","ps":"","pn":""},{"id":"20260802-25","d":"20260802","p":3,"t":"ChatGPTの新しい音声モデル「GPT-Live」でできること","s":"ライフハッカー・ジャパン（原文＝Lifehacker US）","u":"https://www.lifehacker.jp/article/2607-chatgpt-new-improved-voice-mode/","sm":"GPT-Liveは「話す」と「聞く」を同時に処理する全二重方式で、会話の途中で割り込んでも相槌を打ちながら応答できると説明されている。 会話を止めずに、バックグラウンドで複雑な処理や深い思考をサーバー側に送ることができるとされる。 無料ユーザーは「GPT-Live-1 mini」、有料プラン利用者は「GPT-Live-1」を利用可能。リアルタイム翻訳と周囲ノイズ低減機能も強化されたと記載されている。","c":"口頭でのやり取りが自然になるとされているため、移動中に論点を口で整理して下書きに落とす、といった使い方を試す余地があるかもしれません。","tg":["OpenAI","ChatGPT","音声","GPT-Live","新機能"],"i":1,"st":"","tp":"","ps":"","pn":""},{"id":"20260802-24","d":"20260802","p":3,"t":"OpenAI、研究者10万人に最上位モデルを無料提供へ　日本は東大・京大など15大学が対象","s":"ITmedia AI＋","u":"https://www.itmedia.co.jp/aiplus/article/2607/31/2000000333/","sm":"・プログラム名は「ChatGPT for Academic Researchers」。科学・数学・工学分野の研究者が対象で、「GPT-5.6 Sol Pro」を含む最上位モデル群をChatGPT／ChatGPT Work／コーディングエージェント「Codex」で利用できる。\n・2026年夏に1万人規模で開始し、2027年までに10万人規模へ拡大予定。\n・日本は東京大学、京都大学、東京科学大学、早稲田大学、慶應義塾大学など15校が対象。所属機関・研究内容を申請して承認を受ける方式で、承認者は同一機関から最大4人の共同研究者を招待可能。企業向けプランと同等のプライバシー保護を備え、既定ではデータをモデル学習に使わない。","c":"「最上位モデルを無料で配る」動きは、AIの提供形態が価格競争から利用者囲い込みへ移りつつある兆候として見ることもできます。","tg":["OpenAI","提供形態","日本"],"i":1,"st":"","tp":"","ps":"","pn":""},{"id":"20260802-23","d":"20260802","p":3,"t":"Claudeを組織一括管理する「Claude apps gateway」がAWS／Google Cloudに登場　SSO・費用上限設定に対応","s":"Publickey","u":"https://www.publickey1.jp/blog/26/claude_codeclaude_apps_gateway_for_awsgoogle_cloud.html","sm":"・Claude Codeなどを組織単位で管理するためのセルフホスト型ゲートウェイが、AWS版・Google Cloud版として提供開始。\n・OIDC対応のIDプロバイダと連携したシングルサインオン、ロールベースアクセス制御（RBAC）に対応。\n・テレメトリによる利用状況の把握に加え、組織・グループ・ユーザー単位で日次／週次／月次の費用上限を設定できる。バックエンドはAnthropic API、Amazon Bedrock、Microsoft Foundryなど複数に対応し、推論リクエストのルーティングやフェイルオーバーも行う。","c":"個人のアカウント任せでAIを使っている事務所にとって、誰がいくら使ったかを把握する仕組みは、将来の内部統制の論点になり得ます。","tg":["Anthropic","Claude Code","組織管理","コスト管理"],"i":2,"st":"","tp":"","ps":"","pn":""},{"id":"20260802-22","d":"20260802","p":3,"t":"Google、パーソナルAI「Gemini Spark」を日本でも提供開始　メール着信を起点に先回りで動く","s":"ITmedia AI＋","u":"https://www.itmedia.co.jp/news/article/2608/02/2000000347/","sm":"・5月のGoogle I/O 2026で発表されたパーソナルAIエージェント「Gemini Spark」が日本語・英語で利用可能に。対象は「Google AI Ultra」「Google AI Pro」の加入者（Proユーザーには数週間以内に順次展開）。\n・クラウド基盤上で動くため初期設定が不要で、デバイスを閉じていてもバックグラウンドで稼働。メールやチャットの更新をトリガーに自ら起動し、タスクを先回りして処理する。\n・Gemini 3.5を搭載し、Gmail・Googleドキュメント・スプレッドシートと連携。6月の更新でCanva・Dropbox・Instacart等の外部アプリ連携にも対応。Chrome統合（ログイン情報や保存パスワードを使ってWeb手続きを代行）は米国から先行し、決済など機密性の高い操作は人に引き渡す設計。","c":"メール着信を起点にAIが先に動く形は、事務所の問い合わせ一次対応や資料準備の流れと相性を検討する余地がありそうです。","tg":["Google","Gemini","AIエージェント","日本提供"],"i":2,"st":"","tp":"","ps":"","pn":""},{"id":"20260802-21","d":"20260802","p":2,"t":"提案：「AIの完了報告」と「実際の件数」の突合を、書類チェック・OCRの標準検証に","s":"編集部（元ネタ：Zenn）","u":"https://zenn.dev/yumanichan/articles/browser-agent-return-vs-state","sm":"元ネタ＝AIが「25件取得しました」と報告したが実際は432件あった、という沈黙取りこぼしの実例。エラーが出ないまま静かに欠ける型は、報告を信じる運用では検出できない。 当社への適用案＝株価値ドック書類チェックと決算書OCRに「AIの処理件数 vs 入力フォルダの実ファイル数・実ページ数」の機械突合を1ステップ追加する（数を数えるだけの決定論チェック）。 期待効果＝poppler白紙OCR（過去に実際に踏んだ無言取りこぼし）と同型の事故を、レビュー担当の目でなく仕組みで捕まえる。うちの「緑表示≠成功」の運用哲学のスキルへの落とし込み。","c":"次の一歩：書類チェックスキルに件数突合を足す実装は約1時間。次にドック案件が来たタイミングで有効化するのが自然です。","tg":["提案","株価値ドック","決算書OCR"],"i":2,"st":"","tp":"","ps":"未対応","pn":""},{"id":"20260802-20","d":"20260802","p":2,"t":"提案：メール処理に「添付が答えの案件は人へ」の線引きと、下書きのゴールデンセットを","s":"編集部（元ネタ：実測検証記事×2）","u":"https://zenn.dev/ai_worklab/articles/claude-connector-blind-spots","sm":"元ネタ①＝AIにメールを読ませた検証で唯一できなかったのは「添付ファイルの中身」。②＝AIの返信下書きは「ゴールデンセット」（お手本6〜12件）で改訂前後を同じ基準で比較すると劣化に気づける。 当社への適用案＝メール処理スキルに「本文で完結する案件はAI・添付が答えの案件は人が開く」の1行ルールを明文化（既存の安全ルール「添付を自動で開かない」を、業務の切り分けとして言い直す位置づけ）。あわせて、メール下書きの文体プロファイルを直すときのために代表的な下書き6件をゴールデンセットとして固定する。 期待効果＝統括秘書ラインの誤処理防止と、信頼の階段（文体キャリブレーション）の改善を「感覚」でなく「比較」でできるようになる。株価値ドックのゴールデン回帰と同じ思想の横展開。","c":"次の一歩：過去の送信済みメールから「これがうちの文体」という6通を小西さんに選んでもらう（15分）。ルール1行の追記はこちらで実施。","tg":["提案","メール処理","信頼の階段"],"i":2,"st":"","tp":"","ps":"未対応","pn":""},{"id":"20260802-19","d":"20260802","p":2,"t":"提案：CLAUDE.mdの「ダイエット」と、守らせたいルールのhook移行を棚卸ししませんか","s":"編集部（元ネタ：note＋Zenn）","u":"https://note.com/o_ob/n/nd19cba8e11d7","sm":"元ネタ＝「CLAUDE.mdを削ったらAIがかえって賢くなった」。終わった話を消し、長い説明は別ファイルに逃がして参照条件だけ残すと、AIが本当に大事なルールを守りやすくなるという実践報告。 当社への適用案＝うちのCLAUDE.mdも運用開始以来の追記で長大化しており、完了済みの経緯やスキル別詳細が本文に残っている。「生きたルールだけ残す・詳細は各スキルへ・物理的に止めるべきものはhookへ」の3分類で棚卸しする。 期待効果＝全スキルの指示追従が安定する土台整備。別記事「ルールはhookで物理的に止める」の型も併用（うちは削除ブロック等で実績あり＝拡張の余地）。","c":"次の一歩：30分の棚卸しレビューを1回。「消す・移す・hook化」の3リストを作って小西さんに見せるところまで（採否はそこで判断）。","tg":["提案","CLAUDE.md","運用基盤"],"i":2,"st":"","tp":"","ps":"未対応","pn":""},{"id":"20260802-18","d":"20260802","p":1,"t":"全社員が「当たり前に」生成AIを使う会社へ、住友化学が挑む「AIネイティブカンパニー」への道","s":"AIsmiley","u":"https://aismiley.co.jp/ai_news/sumitomo-chem-ai-interview/","sm":"住友化学DX推進室・主任部員の奥野弘尚氏へのインタビュー記事。 全社向け生成AIサービス「ChatSCC」を2023年10月から約6,500名の全従業員を対象に運用開始。外部に情報が漏れないセキュアな環境である点が特徴とされている。 浸透策として、四半期ごとの全社説明会、各部署の「パワーユーザー」による勉強会、水戸社長からのメッセージ発信と社長アバター動画、新入社員教育での生成AI研修、法務・知財と連携したガバナンス整備を実施している。","c":"経営者自身が旗を振り、各部署に先行者を置いて横に広げるという進め方は、規模は違っても事務所内でAIを定着させる際の参考になりそうです。","tg":["導入事例","生成AI","社内浸透","ガバナンス","住友化学"],"i":2,"st":"","tp":"","ps":"","pn":""},{"id":"20260802-17","d":"20260802","p":1,"t":"「AI活用する新人が増えてOJT負担増」複数調査で露呈した現場の苦悩","s":"＠IT（アイティメディア）","u":"https://atmarkit.itmedia.co.jp/ait/articles/2608/02/news004.html","sm":"ジョブサポート社が2026年4月に新人エンジニア1,004名を対象に実施した調査で、AIを「積極的に活用」40.0%、「必要に応じて活用」50.0%と、9割が業務でAIを使っている。 一方で指導側のOJT時間は「極めて増加」26.1%、「中程度増加」51.8%と、合計で約8割が負担増と回答している。 負担の要因は「エラー対応が足かせ」52.3%、「適切な指導が困難」48.9%。記事は「AIに代替されにくい本質的な自走力」＝基本的な課題解決能力の重要性を指摘している。","c":"新人がAIで出した答えの検証に指導側の時間が取られる構図は、税務判断の根拠確認が求められる会計事務所の育成にも重なる部分がありそうです。","tg":["人材育成","OJT","新人","生成AI","調査"],"i":2,"st":"","tp":"","ps":"","pn":""},{"id":"20260802-16","d":"20260802","p":1,"t":"ヤマダデンキ売場に24時間の多言語AI接客　avatarinがGPT-Realtimeで構築、2週間で3万人が利用","s":"OpenAI News","u":"https://openai.com/index/avatarin","sm":"・日本のavatarin社が、OpenAIのGPT-Realtimeを使ってヤマダデンキの買い物客向けに24時間対応の多言語接客エージェントを構築。\n・導入後2週間で3万人が利用し、アンケート回答の92％が肯定的だった。\n・音声・テキスト・視覚理解を1つの対話体験にまとめられる点が採用の決め手。OpenAI側は複雑なプロンプトの構造化、常時稼働の音声サービスにおけるAPIコスト最適化、実装のベストプラクティス共有で協業した。avatarinは同プロジェクト以前からOpenAI APIを音声認識・問い合わせ分析・従業員研修に使っていた。","c":"人手が確保しづらい業種の顧問先にとって、接客・受付を人からAIに置き換える現実的な選択肢が出てきた事例として紹介できそうです。","tg":["活用事例","日本企業","小売","音声AI"],"i":2,"st":"","tp":"","ps":"","pn":""},{"id":"20260802-15","d":"20260802","p":1,"t":"Microsoft、Copilot有料シート3000万超を公表　評価軸は「導入数」から「仕事がどう変わったか」へ","s":"Microsoft Source","u":"https://www.microsoft.com/en-us/microsoft-365/blog/2026/07/30/the-next-measure-of-ai-momentum-is-work-transformed/","sm":"・Microsoftは、AI導入の評価をライセンス数などの導入指標ではなく「仕事そのものがどう変わったか（利用の深さと広がり）」で測るべきだと主張。\n・数値として、Microsoft 365 Copilotの有料シートが3000万超、純増シート数が四半期比で2倍以上、5万シート以上の顧客が前年比7倍超、情報労働者の過半にCopilotを展開する企業が四半期比で約75％増と報告。1ユーザーあたりの会話数は前年比でほぼ倍増し、週次の平均利用頻度はOutlookやTeamsと並ぶ水準に達したとする。\n・新機能として、複数ステップの作業を一気通貫で実行する「Copilot Cowork」（単一モデル利用より30〜40％安価と説明）、独立したIDと権限を持つ自律バックグラウンドエージェント「Microsoft Scout」などを挙げる。","c":"自社の数字を有利に見せる発表である点は割り引く必要がありますが、「ライセンスを配ったか」ではなく「業務がどう変わったか」で測る発想自体は、事務所のAI投資の振り返りにも使えそうです。","tg":["Microsoft","Copilot","導入効果","ベンダー発表"],"i":2,"st":"","tp":"","ps":"","pn":""},{"id":"20260802-14","d":"20260802","p":1,"t":"AIエージェントは法務でどこまで使えるか　弁護士法72条との線引きが最大の論点","s":"AINOW","u":"https://ainow.ai/2026/07/24/278277/","sm":"・「答えるAI」の生成AIに対し、AIエージェントは「実行するAI」として、契約書のアップロードだけでリスク条項の検出から修正案提示まで自律的に処理する点を整理。\n・活用場面は、契約審査（リスク条項の自動検出と修正案提示）、法務相談の一次対応（社内規程を参照して完結させ、難しい案件のみ担当者へエスカレーション）、法令リサーチ（複数データベースの横断検索）。\n・注意点として弁護士法72条の非弁行為との関係を最重要に挙げ、自社の法務業務に限定すれば問題ない一方、他社の紛争解決を代行するサービス設計は違法となり得るとする。入力データが学習に使われない設定の確認、最終決定は人が行うHuman-in-the-loop体制の必要性にも言及。","c":"「自社内の業務に限れば可、他人の事件を代行すると不可」という線引きの考え方は、税理士法上の税務代理・税務相談の整理を検討する際にも参考になりそうです。","tg":["士業","法務","AIエージェント","非弁行為"],"i":2,"st":"","tp":"","ps":"","pn":""},{"id":"20260802-13","d":"20260802","p":1,"t":"経理AIエージェントとRPAは何が違うのか　「例外で止まるか、判断して進むか」で見極める","s":"AINOW","u":"https://ainow.ai/2026/07/24/278274/","sm":"・RPAは決まった手順の反復が前提で、例外が出ると処理が止まる。対して経理AIエージェントは状況に応じた判断を伴う処理が得意で、たとえば請求書の記載が規程と一致しない場合に差異を判断し、承認者への確認や差し戻しまで自ら進められる、と整理している。\n・想定用途として、請求書処理（照合・未入金検知・関係者への通知まで一連）、経費精算（規程照合・一次承認・差し戻し）、仕訳入力と決算業務（処理パターンの学習と異常値検出）、不正検知（通常パターンから外れた取引の監視）を挙げる。\n・導入時の注意点として、セキュリティと権限設計、判断根拠のブラックボックス化対策、法令改正への対応体制の構築を挙げ、スモールスタートからの段階的拡大を推奨している。","c":"「例外処理を人が拾う」前提で組んできた記帳・請求まわりの業務分担を、どこまでAI側に寄せるかを考える材料になりそうです。","tg":["経理DX","AIエージェント","RPA","業務効率化"],"i":2,"st":"","tp":"","ps":"","pn":""},{"id":"20260802-12","d":"20260802","p":1,"t":"会話が長くなると起きる「自動要約100%でのフリーズ」と、3つの回避策","s":"Zenn・ミケ氏（joemike）","u":"https://zenn.dev/joemike/articles/claude-code-auto-compact-deadlock-workaround-2026","sm":"①2026年5月から現象を観察し、公式の不具合報告（GitHub Issue #66144ほか）など複数の独立した報告を参照している。②会話量が上限に達したときの自動要約が固まり、直前の文脈判断を失って誤ったブランチにコミットしようとするなどの誤動作が起きる。③回避策は3つで、要約直前にセッションログを退避させる仕掛け、会話量が8割に達した時点で自分から手動要約をかけること、1タスク1セッションで区切る設計。会話量6〜8割で整理を始め、8割超で手動要約を検討する、という目安を示している。","c":"長時間セッションで固まった経験があるなら、8割を目安に自分から区切る運用ルールとして取り入れられるかもしれません。","tg":["ClaudeCode","トラブル対処","セッション管理"],"i":2,"st":"","tp":"","ps":"","pn":""},{"id":"20260802-11","d":"20260802","p":1,"t":"毎朝AIに「役員会議」の資料を作らせた27日間の実測記録","s":"Zenn・ai_worklab（moname_ai氏）","u":"https://zenn.dev/ai_worklab/articles/claude-p-cron-morning-board","sm":"①2026年7月7日から8月2日まで27日間、毎朝の自動実行を回し、成功率は93%（25/27日）。失敗した2日はいずれも「PCの電源が入っていなかった」ことが原因だった。②AIに許可した操作は読み取り・検索・書き出しのみに絞り（コマンド実行は不可）、制限時間は600秒、追加のAPI課金は0円。③毎朝A4一枚に「3行サマリ・数値の前回比・計画との対比・差の分析・仮説と決めるべきこと」を決まった形式で出力させている。","c":"日刊ウォッチのような定時実行を『何%動いたか・落ちた原因は何か』まで記録して見える化する型として参考になりそうです。","tg":["定時実行","ClaudeCode","無人運用","稼働率"],"i":2,"st":"","tp":"","ps":"","pn":""},{"id":"20260802-10","d":"20260802","p":1,"t":"セッションが変わっても「昨日の続き」から始める（Windows・PowerShellでの実装例）","s":"Zenn・Answer氏","u":"https://zenn.dev/answer_philo/articles/claude-code-hooks-yesterday-continued","sm":"①セッション開始時に走る仕掛け（SessionStart）で、直近のメモファイル（日付ごとのmdなど）の中身を会話の冒頭に自動で流し込む。②その処理を recall.ps1 というPowerShellスクリプトで実装し、読み込みが止まらないよう5秒で打ち切るタイムアウトを入れている。③設定ファイルの中身をハッシュで比較し、何度実行しても同じ状態に揃う（重複して増えない）ようにする ensure_config.ps1 も併用している。","c":"毎回『引き継ぎ.md を読む』を人力で始めている部分を、セッション開始時に自動で流し込む形に寄せられるかもしれません（Windows・PowerShellでの実装例という点もうちの環境に近いです）。","tg":["ClaudeCode","hook","SessionStart","Windows","引き継ぎ"],"i":2,"st":"","tp":"","ps":"","pn":""},{"id":"20260802-09","d":"20260802","p":1,"t":"AIに「ルールを守って」と言うのをやめ、hookで物理的に止める仕組みにした","s":"Zenn・ぴろゆき氏","u":"https://zenn.dev/triponte/articles/claude-code-hook-enforce-rules","sm":"①メモへの追記を「200字程度で」と口頭で指示していたが、AIは何度言っても守らなかった。②そこで設定ファイルに PreToolUse（編集の直前に走る仕掛け）を仕込み、書き込み前に判定スクリプトを通すようにした。③判定スクリプトが文字数を数え、200字を超えていたら拒否を返して編集そのものを止める。筆者は「口で言うルール遵守はAIの記憶に依存して必ず破られる。破ったら止まる仕組みを自分で作るべき」と述べている。","c":"うちの削除ブロックや外向き送信のキルスイッチと同じ発想なので、CLAUDE.mdに書いているだけで守られていないルールをhook側へ移す候補洗い出しに使えそうです。","tg":["ClaudeCode","hook","ガードレール","運用"],"i":2,"st":"","tp":"","ps":"","pn":""},{"id":"20260802-08","d":"20260802","p":1,"t":"AIが「25件取得しました」と報告。実際は432件あった","s":"Zenn・ユウマ氏（Effortless Works）","u":"https://zenn.dev/yumanichan/articles/browser-agent-return-vs-state","sm":"①求人サイトのチャット一覧をAIに取らせたところ「25件取得完了」と報告されたが、実際は432件あった（画面をスクロールしないと読み込まれない部分を取りこぼしていた）。②画面の拡大率のズレ（2231×1059の画面を1568×744に縮めた際の1.423倍のずれ）で、隣の列を誤クリックする例も起きた。③日本語の長文入力で「24歳」が「7726歳」になるなど、4箇所の欠落・置換が発生した。筆者は「AIの『できました』という自己申告を鵜呑みにせず、実際の状態を突き合わせて確かめること」を強調している。","c":"エラーが出ないまま静かに取りこぼす型の事故で、決算書OCRや書類チェックでも『AIの完了報告と実件数を必ず数え合わせる』ステップの必要性を裏づけているように見えます。","tg":["AIエージェント","失敗談","検証","サイレント欠損"],"i":2,"st":"","tp":"","ps":"","pn":""},{"id":"20260802-07","d":"20260802","p":1,"t":"AIの承認待ちが月300件を超えてパンク。リスク3層に分けたら月30件になった","s":"Zenn・JOINCLASS（合同会社ジョインクラス）","u":"https://zenn.dev/joinclass/articles/ai-300-20260721220003-5956","sm":"①月300件を超えた承認待ちを、「読むだけの層」「実行してよい層（例：月額5,000円未満なら自動承認）」「下書きまでで人が判断する層（新規取引先・取り消せない操作）」の3層に分けた。②その結果、承認待ちは月300件から月30件（10分の1）になり、自動化率98%・17個の定時ジョブが回っている。③途中で承認ルールが1,000行超に膨らんで逆に混乱した、という失敗も書かれている。筆者は「破綻の原因はAIの精度ではなく承認プロセスの設計だった」と結論づけている。","c":"メール承認の『信頼の階段』で、どこまでを自動で通しどこから人に上げるかを金額や影響範囲で線引きするときの参考になりそうです。","tg":["承認設計","HITL","自動化","運用"],"i":2,"st":"","tp":"","ps":"","pn":""},{"id":"20260802-06","d":"20260802","p":1,"t":"AIの返信下書きを改造する前に、「ゴールデンセット」で前後を同じ基準で比べる","s":"Zenn・Kirisaki Kazuya氏（Miraigent）","u":"https://zenn.dev/miraigent/articles/ai-reply-golden-test-set","sm":"①テストケースは6〜12件という少数で構成する。②ケースを「通常／情報不足／要配慮／機密／判断不可」の5分類に整理し、それぞれ代表例を1つ持つ。③ケース集・採点基準・実行結果をフォルダで分けて保存し、必須項目がすべて合格なら通過とする。筆者は「プロンプトの巧拙より、同じケースを同じ基準で変更前後に比べられることのほうが重要」と主張している。","c":"株価値ドックで使っているゴールデン回帰と同じ考え方をメール下書き側にも持ち込む形で、文体プロファイルを直すたびに劣化していないか確認できるかもしれません。","tg":["メール下書き","ゴールデンセット","品質管理","回帰テスト"],"i":2,"st":"","tp":"","ps":"","pn":""},{"id":"20260802-05","d":"20260802","p":1,"t":"Pythonが書けない製造業の会社員が、Claude Codeで作った業務ツール29本の全リスト","s":"Zenn・NOCODE AI LAB（製造業・生産管理担当）","u":"https://zenn.dev/h_nocode_ai_lab/articles/4a64696ee29461","sm":"①プログラミング未経験のまま約3.5ヶ月でツールを29本作り、処理したデータは81万件超、書いたスクリプトは130本以上になった。②ツールをデータ集計／レポート自動化／ファイル操作／通知・アラート／データ変換／個人用の6カテゴリに整理して一覧化している。③うまくやるコツとして「小さく作る」「エラーメッセージはそのまま貼って聞く」「完璧を求めない」など5点を挙げている。","c":"非エンジニアがClaude Codeで自作を積み上げた実例で、うちのツール群を棚卸しして見せ方を整えるときの参考になりそうです。","tg":["ClaudeCode","非エンジニア","自作ツール","業務効率化"],"i":2,"st":"","tp":"","ps":"","pn":""},{"id":"20260802-04","d":"20260802","p":1,"t":"委任の指示文に1行書き忘れただけで、AIが勝手に190行書き換えた事故","s":"Qiita・saitoko氏（さいとうこういち）","u":"https://qiita.com/saitoko/items/435f0661b6210ff5b734","sm":"①自作の自動改善スキルを初回テストしたところ、依頼していない個人用スクリプト（音楽再生用の dj.sh）が169行追加・21行削除の計190行、承認なしに書き換えられた。②原因は、調査担当のサブエージェントへ渡す委任の指示文に「分析のみ・修正禁止」の1行を書き忘れていたこと。③対策として、その場で委任テンプレに読み取り専用の制約を追記し、恒久策として運用ルールのファイルにチェックポイントを追加した。筆者は「指示した内容ではなく、指示し忘れた1行で暴走する」とまとめている。","c":"うちもサブエージェントに作業を投げる場面が多いので、委任時に『やってよいこと』だけでなく『やってはいけないこと』を毎回定型で入れる、という発想は効きそうです。","tg":["ClaudeCode","サブエージェント","失敗談","委任設計"],"i":2,"st":"","tp":"","ps":"","pn":""},{"id":"20260802-03","d":"20260802","p":1,"t":"AIにメールを読ませて検証したら、唯一できなかったのは「添付ファイルの中身」だった","s":"Zenn・ai_worklab（moname_ai氏）","u":"https://zenn.dev/ai_worklab/articles/claude-connector-blind-spots","sm":"①テストメール74通（狙いの14通＋紛れ込ませたダミー60通）に加え既存の約1,190通、予定21件を使って、AIのメール読み取り能力を6つの観点で検証した。②10問中9問が正解で、何ヶ月前まで遡れるか・表記ゆれ（社名の書き方違いなど）・スレッド追跡・対応済みかどうかの判定・カレンダー連携は、いずれも実用に耐える精度だった。③唯一失敗したのが「添付ファイルの中身を読んで答える」項目で、見積書・請求書・仕様書のように添付が答えそのものになる業務はAIに任せられない、と結論づけている。","c":"メール処理スキルで『本文はAIに任せ、添付が答えになる案件は人が開く』という線引きを明文化する根拠になりそうです。","tg":["メール処理","検証","添付ファイル","業務切り分け"],"i":2,"st":"","tp":"","ps":"","pn":""},{"id":"20260802-02","d":"20260802","p":1,"t":"CLAUDE.md と AGENTS.md を削ったら、AIがかえって賢くなった","s":"note・白井暁彦氏（しらいはかせ）","u":"https://note.com/o_ob/n/nd19cba8e11d7","sm":"①AIへの指示書から「完了済みタスク」「日々変わる進捗情報」を削除した。②長大な仕様書は別ファイルに切り出し、指示書には『こういうときはこれを見る』という参照条件だけを残した。③使っていないスキル・プラグインの記述も整理し、指示書の分量を半分以上減らしたところ、AIの動きが良くなった。筆者は「情報を詰め込むことが文脈設計ではない。百科事典ではなく航海図を渡すこと」とまとめている。","c":"うちのCLAUDE.mdも積み上がって長くなっているので、「終わった話は消す・長い説明は別ファイルに逃がして参照条件だけ書く」という整理の型がそのまま当てはまるかもしれません。","tg":["ClaudeCode","CLAUDE.md","文脈設計","指示書整理"],"i":3,"st":"","tp":"","ps":"","pn":""},{"id":"20260802-01","d":"20260802","p":1,"t":"【実測】freeeのMCPは「読み取り専用」に設定しても書き込み権限が付いてしまう","s":"Qiita・mamagotolab氏","u":"https://qiita.com/mamagotolab/items/a482fb1c5e2ddfaa58e3","sm":"①検証用のfreeeアプリを別途作ってOAuthで実測したところ、環境変数で FREEE_SCOPE=read と指定しても、実際には仕訳の書き込み権限（accounting:deals:write）が付与されていた。②freeeアプリの既定スコープがそもそも「read write」であるため、環境変数側の指定は効いていない。③MCPの道具立てがHTTPメソッド単位の汎用設計になっているため、道具ごとに「これは読むだけ」と絞ることが構造上できない。結論として、権限を絞るならfreeeのアプリ設定そのものを分ける（読み取り専用アプリと書き込み用アプリを別登録する）しかない、としている。","c":"AIに会計データベースへ触らせる前に「読むだけのつもりが書けてしまう」という穴の実例で、弥生や会計連携をAI経由でつなぐときの権限の切り方を考える材料になりそうです。","tg":["会計","MCP","権限設計","freee","安全設計"],"i":3,"st":"","tp":"","ps":"","pn":""}];
const PAGE_SHORT={"1":"実践","2":"提案","3":"ツール","4":"動向"};
let q='',pageF=0,tagF='';
function paperHref(a){return 'articles/'+a.id+'.html';}
function fmtD(d){return d.slice(0,4)+'/'+d.slice(4,6)+'/'+d.slice(6,8);}
function el(tag,cls,text){const e=document.createElement(tag);if(cls)e.className=cls;if(text!==undefined)e.textContent=text;return e;}
function render(){
  const terms=q.trim().toLowerCase().split(/\s+/).filter(Boolean);
  const hit=DATA.filter(a=>{
    if(pageF&&a.p!==pageF)return false;
    if(tagF&&!a.tg.includes(tagF))return false;
    if(!terms.length)return true;
    const hay=(a.t+' '+a.sm+' '+a.c+' '+a.tg.join(' ')+' '+a.s+' '+a.st+' '+a.ps+' '+a.pn).toLowerCase();
    return terms.every(t=>hay.includes(t));
  });
  const byDay={};
  for(const a of hit)(byDay[a.d]=byDay[a.d]||[]).push(a);
  const days=Object.keys(byDay).sort().reverse();
  const list=document.getElementById('list');
  list.replaceChildren();
  if(!days.length){list.appendChild(el('p','nores','該当する記事がありません。'));return;}
  for(const d of days){
    const day=el('div','day');
    const h2=el('h2');
    const ha=el('a',null,fmtD(d)+' の紙面');
    ha.href=d.slice(0,4)+'-'+d.slice(4,6)+'/'+d+'.html';
    h2.appendChild(ha);day.appendChild(h2);
    for(const a of byDay[d]){
      const row=el('div','row');
      row.appendChild(el('span','pg p'+a.p,PAGE_SHORT[a.p]||''));
      const tt=el('a','tt i'+a.i,a.t);
      tt.href=paperHref(a);
      row.appendChild(tt);
      if(a.st)row.appendChild(el('span','mt',a.st));
      if(a.ps)row.appendChild(el('span','ps ps'+({'未対応':0,'やる':1,'実装済み':2,'見送り':3}[a.ps]??0),a.ps));
      row.appendChild(el('span','mt',a.s));
      day.appendChild(row);
    }
    list.appendChild(day);
  }
}
document.getElementById('q').addEventListener('input',e=>{q=e.target.value;render();});
document.querySelectorAll('#pageChips .chip').forEach(c=>c.addEventListener('click',()=>{
  const p=+c.dataset.page;pageF=(pageF===p)?0:p;
  document.querySelectorAll('#pageChips .chip').forEach(x=>x.classList.toggle('on',+x.dataset.page===pageF));render();}));
document.querySelectorAll('#tagChips .chip').forEach(c=>c.addEventListener('click',()=>{
  const t=c.dataset.tag;tagF=(tagF===t)?'':t;
  document.querySelectorAll('#tagChips .chip').forEach(x=>x.classList.toggle('on',x.dataset.tag===tagF));render();}));
render();
</script></body></html>
